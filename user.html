<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khiladi – Esports Tournament</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="container">
        <h1>🏆 Khiladi</h1>
        <p class="tagline">Esports Tournament Platform</p>
        <button id="google-login-btn">🚀 Sign in with Google</button>
        <div id="login-error" class="error-msg"></div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="container hidden">
        <header>
            <div class="brand">🏆 Khiladi</div>
            <div class="header-right">
                <div class="account-dropdown">
                    <span id="user-name" class="account-btn">User ▼</span>
                    <div id="account-menu" class="dropdown-content hidden">
                        <button id="logout-btn" class="btn-danger">🚪 Logout</button>
                    </div>
                </div>
                <div class="wallet" id="wallet-click">💰 ₹<span id="user-balance">0</span></div>
            </div>
        </header>

        <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">
            <button id="topup-btn" class="btn-secondary">➕ Top Up</button>
        </div>

        <section class="offers">
            <div class="offer-card">🎁 First login bonus: <strong>₹10</strong> credited!</div>
        </section>

        <section id="games-section">
            <h2>🎮 Games</h2>
            <div id="games-list" class="grid-container"></div>
        </section>

        <section id="tournaments-section" class="hidden">
            <button id="back-btn" onclick="hideTournaments()" class="btn-secondary">⬅ Back</button>
            <h2 id="selected-game-title">Tournaments</h2>
            <div id="tournaments-container"></div>
        </section>
    </div>

    <!-- Withdrawal Modal -->
    <div id="withdraw-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="closeWithdrawModal()">&times;</span>
            <h2>💸 Withdraw Funds</h2>
            <p>Minimum withdrawal: <strong>₹200</strong></p>
            <input type="text" id="upi-input" placeholder="UPI ID (e.g., abc@upi)" />
            <input type="number" id="withdraw-amount" placeholder="Amount (₹)" min="200" />
            <button id="submit-withdraw-btn" class="btn-primary">Submit Request</button>
            <div id="withdraw-status" class="error-msg"></div>
        </div>
    </div>

    <!-- Join Tournament Modal -->
    <div id="join-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="closeJoinModal()">&times;</span>
            <h2>🎮 Join Tournament</h2>
            <p>Please provide your in-game details</p>
            <input type="text" id="ingame-name" placeholder="In-Game Name" />
            <input type="text" id="ingame-uid" placeholder="In-Game UID" />
            <button id="confirm-join-btn" class="btn-primary">Confirm Join</button>
            <div id="join-error" class="error-msg"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
