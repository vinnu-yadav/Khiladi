<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Arena</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f0f1a; color: #fff; min-height: 100vh; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #1a1a2e; border-bottom: 2px solid #e94560; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: #e94560; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links button { background: #e94560; color: white; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .nav-links button:hover { background: #c73e54; transform: translateY(-2px); }
        .wallet-badge { background: #16213e; padding: 8px 16px; border-radius: 20px; border: 1px solid #e94560; font-weight: 600; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .section-title { font-size: 28px; margin-bottom: 20px; color: #e94560; border-left: 4px solid #e94560; padding-left: 15px; }
        .auth-box { max-width: 400px; margin: 80px auto; background: #1a1a2e; padding: 40px; border-radius: 12px; border: 1px solid #333; }
        .auth-box h2 { text-align: center; margin-bottom: 25px; color: #e94560; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #aaa; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #333; background: #0f0f1a; color: #fff; border-radius: 6px; outline: none; }
        .form-group input:focus { border-color: #e94560; }
        .btn { width: 100%; padding: 12px; background: #e94560; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #c73e54; }
        .toggle-auth { text-align: center; margin-top: 15px; color: #aaa; }
        .toggle-auth a { color: #e94560; cursor: pointer; text-decoration: underline; }
        .tournament-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .tournament-card { background: #1a1a2e; border-radius: 12px; overflow: hidden; border: 1px solid #333; transition: 0.3s; }
        .tournament-card:hover { transform: translateY(-5px); border-color: #e94560; box-shadow: 0 10px 30px rgba(233,69,96,0.2); }
        .card-header { padding: 20px; background: #16213e; border-bottom: 1px solid #333; }
        .card-header h3 { color: #e94560; margin-bottom: 5px; }
        .game-tag { display: inline-block; background: #e94560; color: white; padding: 3px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .card-body { padding: 20px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
        .info-row span:first-child { color: #aaa; }
        .info-row span:last-child { font-weight: 600; }
        .prize-pool { color: #ffd700; font-size: 18px; font-weight: bold; }
        .card-footer { padding: 15px 20px; border-top: 1px solid #333; display: flex; gap: 10px; }
        .btn-join { flex: 1; padding: 10px; background: #e94560; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-join:disabled { background: #444; cursor: not-allowed; }
        .status-badge { padding: 5px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .status-upcoming { background: #3498db; }
        .status-live { background: #2ecc71; }
        .status-completed { background: #7f8c8d; }
        .topup-section { background: #1a1a2e; padding: 30px; border-radius: 12px; border: 1px solid #333; max-width: 500px; margin: 20px auto; }
        .topup-amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .amount-btn { padding: 15px; background: #16213e; border: 2px solid #333; color: white; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; transition: 0.3s; }
        .amount-btn:hover, .amount-btn.selected { border-color: #e94560; background: rgba(233,69,96,0.1); }
        .hidden { display: none !important; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; background: none; border: none; color: #aaa; cursor: pointer; font-size: 16px; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #e94560; border-bottom-color: #e94560; }
        .wallet-display { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .wallet-card { flex: 1; min-width: 150px; background: #16213e; padding: 20px; border-radius: 10px; text-align: center; border: 1px solid #333; }
        .wallet-card h4 { color: #aaa; margin-bottom: 8px; font-size: 14px; }
        .wallet-card .amount { font-size: 24px; font-weight: bold; color: #2ecc71; }
        .wallet-card.bonus .amount { color: #ffd700; }
        .error-msg { color: #e94560; font-size: 13px; margin-top: 5px; }
        .success-msg { color: #2ecc71; font-size: 13px; margin-top: 5px; }
        .loading { text-align: center; padding: 40px; color: #aaa; }
        .no-data { text-align: center; padding: 40px; color: #666; }
        @media (max-width: 768px) { .tournament-grid { grid-template-columns: 1fr; } .nav-links { gap: 10px; } .wallet-badge { font-size: 12px; padding: 6px 10px; } }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div id="authScreen">
        <div class="auth-box">
            <h2 id="authTitle">Login</h2>
            <div id="registerFields" class="hidden">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="Enter your name">
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="authEmail" placeholder="Enter email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="authPassword" placeholder="Enter password">
            </div>
            <div id="authError" class="error-msg"></div>
            <button class="btn" id="authBtn" onclick="handleAuth()">Login</button>
            <div class="toggle-auth">
                <span id="authToggleText">Don't have an account? </span>
                <a onclick="toggleAuthMode()" id="authToggleLink">Register</a>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="hidden">
        <div class="navbar">
            <div class="logo">🏆 Tournament Arena</div>
            <div class="nav-links">
                <div class="wallet-badge">💰 ₹<span id="totalWallet">0</span></div>
                <button onclick="showSection('tournaments')">Tournaments</button>
                <button onclick="showSection('wallet')">Wallet</button>
                <button onclick="showSection('myTournaments')">My Tournaments</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="container">
            <!-- Tournaments Section -->
            <div id="tournamentsSection">
                <h2 class="section-title">Active Tournaments</h2>
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="filterTournaments('all')">All</button>
                    <button class="tab-btn" onclick="filterTournaments('upcoming')">Upcoming</button>
                    <button class="tab-btn" onclick="filterTournaments('live')">Live</button>
                    <button class="tab-btn" onclick="filterTournaments('completed')">Completed</button>
                </div>
                <div id="tournamentsList" class="tournament-grid">
                    <div class="loading">Loading tournaments...</div>
                </div>
            </div>

            <!-- Wallet Section -->
            <div id="walletSection" class="hidden">
                <h2 class="section-title">My Wallet</h2>
                <div class="wallet-display">
                    <div class="wallet-card bonus">
                        <h4>🎁 Bonus Cash</h4>
                        <div class="amount">₹<span id="bonusCash">0</span></div>
                    </div>
                    <div class="wallet-card">
                        <h4>💵 Deposited</h4>
                        <div class="amount">₹<span id="depositedCash">0</span></div>
                    </div>
                    <div class="wallet-card" style="border-color: #e94560;">
                        <h4>💰 Total Balance</h4>
                        <div class="amount">₹<span id="totalBalance">0</span></div>
                    </div>
                </div>

                <div class="topup-section">
                    <h3 style="text-align: center; margin-bottom: 10px; color: #e94560;">💳 Top Up</h3>
                    <p style="text-align: center; color: #aaa; margin-bottom: 20px;">Select amount to add to your wallet</p>
                    <div class="topup-amounts">
                        <button class="amount-btn" onclick="selectAmount(50)">₹50</button>
                        <button class="amount-btn" onclick="selectAmount(100)">₹100</button>
                        <button class="amount-btn" onclick="selectAmount(200)">₹200</button>
                        <button class="amount-btn" onclick="selectAmount(500)">₹500</button>
                        <button class="amount-btn" onclick="selectAmount(1000)">₹1000</button>
                        <button class="amount-btn" onclick="selectAmount(2000)">₹2000</button>
                    </div>
                    <div class="form-group">
                        <label>Custom Amount (₹)</label>
                        <input type="number" id="customAmount" placeholder="Enter custom amount" oninput="clearSelection()">
                    </div>
                    <button class="btn" onclick="processTopup()">Add Money</button>
                    <div id="topupMsg" style="margin-top: 10px; text-align: center;"></div>
                </div>

                <div style="margin-top: 30px;">
                    <h3 style="color: #e94560; margin-bottom: 15px;">Transaction History</h3>
                    <div id="transactionList" style="background: #1a1a2e; border-radius: 10px; padding: 20px; border: 1px solid #333;">
                        <div class="no-data">No transactions yet</div>
                    </div>
                </div>
            </div>

            <!-- My Tournaments Section -->
            <div id="myTournamentsSection" class="hidden">
                <h2 class="section-title">My Tournaments</h2>
                <div id="myTournamentsList" class="tournament-grid">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBwqjgRRtZC9RJ34m-g5r0TBOx4G7AMDjc",
            authDomain: "tournament-a7659.firebaseapp.com",
            databaseURL: "https://tournament-a7659-default-rtdb.firebaseio.com",
            projectId: "tournament-a7659",
            storageBucket: "tournament-a7659.firebasestorage.app",
            messagingSenderId: "458496922243",
            appId: "1:458496922243:web:2aeb4b04bc9676e44a01b6",
            measurementId: "G-FK9L8N9WSD"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null, userData = null, allTournaments = {}, selectedTopupAmount = 0, isRegisterMode = false;

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('authTitle').textContent = isRegisterMode ? 'Register' : 'Login';
            document.getElementById('authBtn').textContent = isRegisterMode ? 'Register' : 'Login';
            document.getElementById('registerFields').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('authToggleText').textContent = isRegisterMode ? 'Already have an account? ' : "Don't have an account? ";
            document.getElementById('authToggleLink').textContent = isRegisterMode ? 'Login' : 'Register';
            document.getElementById('authError').textContent = '';
        }

        function handleAuth() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const errorEl = document.getElementById('authError');
            if (!email || !password) { errorEl.textContent = 'Please fill all fields'; return; }
            if (password.length < 6) { errorEl.textContent = 'Password must be at least 6 characters'; return; }

            if (isRegisterMode) {
                const name = document.getElementById('regName').value.trim();
                if (!name) { errorEl.textContent = 'Please enter your name'; return; }
                auth.createUserWithEmailAndPassword(email, password)
                    .then(cred => db.ref('users/' + cred.user.uid).set({
                        name: name, email: email, wallet: { bonus: 10, deposited: 0 },
                        createdAt: Date.now(), joinedTournaments: {}
                    }))
                    .then(() => { errorEl.className = 'success-msg'; errorEl.textContent = 'Account created! ₹10 bonus added!'; })
                    .catch(err => { errorEl.textContent = err.message; });
            } else {
                auth.signInWithEmailAndPassword(email, password).catch(err => { errorEl.textContent = err.message; });
            }
        }

        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                loadUserData(); loadTournaments(); loadTransactions();
            } else {
                currentUser = null;
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        function loadUserData() {
            db.ref('users/' + currentUser.uid).on('value', snap => {
                userData = snap.val() || {};
                const wallet = userData.wallet || { bonus: 0, deposited: 0 };
                document.getElementById('bonusCash').textContent = wallet.bonus || 0;
                document.getElementById('depositedCash').textContent = wallet.deposited || 0;
                const total = (wallet.bonus || 0) + (wallet.deposited || 0);
                document.getElementById('totalBalance').textContent = total;
                document.getElementById('totalWallet').textContent = total;
            });
        }

        function loadTournaments() {
            db.ref('tournaments').on('value', snap => {
                allTournaments = snap.val() || {};
                renderTournaments('all');
                loadMyTournaments();
            });
        }

        function renderTournaments(filter) {
            const container = document.getElementById('tournamentsList');
            let html = '';
            const keys = Object.keys(allTournaments).sort((a, b) => (allTournaments[b].createdAt || 0) - (allTournaments[a].createdAt || 0));
            keys.forEach(id => {
                const t = allTournaments[id];
                if (filter !== 'all' && t.status !== filter) return;
                const joined = userData && userData.joinedTournaments && userData.joinedTournaments[id];
                const spotsLeft = (t.maxPlayers || 100) - Object.keys(t.participants || {}).length;
                const isFull = spotsLeft <= 0;
                const canJoin = t.status === 'upcoming' && !joined && !isFull;
                let statusClass = 'status-upcoming';
                if (t.status === 'live') statusClass = 'status-live';
                if (t.status === 'completed') statusClass = 'status-completed';
                html += `
                    <div class="tournament-card">
                        <div class="card-header">
                            <h3>${t.name}</h3>
                            <span class="game-tag">${t.game || 'Game'}</span>
                        </div>
                        <div class="card-body">
                            <div class="info-row"><span>Prize Pool</span><span class="prize-pool">₹${t.prizePool || 0}</span></div>
                            <div class="info-row"><span>Entry Fee</span><span>₹${t.entryFee || 0}</span></div>
                            <div class="info-row"><span>Date & Time</span><span>${t.dateTime || 'TBD'}</span></div>
                            <div class="info-row"><span>Spots Left</span><span>${spotsLeft}/${t.maxPlayers || 100}</span></div>
                            <div class="info-row"><span>Status</span><span class="status-badge ${statusClass}">${t.status || 'upcoming'}</span></div>
                        </div>
                        <div class="card-footer">
                            ${joined ? '<button class="btn-join" disabled>✅ Joined</button>' :
                              canJoin ? `<button class="btn-join" onclick="joinTournament('${id}')">Join Now</button>` :
                              isFull ? '<button class="btn-join" disabled>Full</button>' :
                              '<button class="btn-join" disabled>Closed</button>'}
                        </div>
                    </div>`;
            });
            container.innerHTML = html || '<div class="no-data">No tournaments available</div>';
        }

        function filterTournaments(status) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderTournaments(status);
        }

        function joinTournament(tournamentId) {
            const t = allTournaments[tournamentId];
            if (!t) return;
            const entryFee = parseInt(t.entryFee) || 0;
            const wallet = userData.wallet || { bonus: 0, deposited: 0 };
            const total = (wallet.bonus || 0) + (wallet.deposited || 0);
            if (total < entryFee) { alert('Insufficient balance! Please top up your wallet.'); showSection('wallet'); return; }
            if (!confirm(`Join "${t.name}" for ₹${entryFee}?`)) return;

            let remaining = entryFee;
            let newBonus = wallet.bonus || 0;
            let newDeposited = wallet.deposited || 0;
            if (newBonus >= remaining) { newBonus -= remaining; remaining = 0; }
            else { remaining -= newBonus; newBonus = 0; newDeposited -= remaining; }

            const updates = {};
            const txId = db.ref().push().key;
            updates['users/' + currentUser.uid + '/wallet'] = { bonus: newBonus, deposited: newDeposited };
            updates['users/' + currentUser.uid + '/joinedTournaments/' + tournamentId] = { joinedAt: Date.now(), status: 'joined' };
            updates['tournaments/' + tournamentId + '/participants/' + currentUser.uid] = { name: userData.name, joinedAt: Date.now() };
            updates['transactions/' + txId] = { userId: currentUser.uid, userName: userData.name, amount: -entryFee, type: 'join', description: 'Joined: ' + t.name, timestamp: Date.now() };

            db.ref().update(updates).then(() => alert('Successfully joined tournament!')).catch(err => alert('Error: ' + err.message));
        }

        function loadMyTournaments() {
            const container = document.getElementById('myTournamentsList');
            if (!userData || !userData.joinedTournaments) { container.innerHTML = '<div class="no-data">You haven\'t joined any tournaments yet</div>'; return; }
            let html = '';
            Object.keys(userData.joinedTournaments).forEach(id => {
                const t = allTournaments[id];
                if (!t) return;
                let statusClass = 'status-upcoming';
                if (t.status === 'live') statusClass = 'status-live';
                if (t.status === 'completed') statusClass = 'status-completed';
                html += `
                    <div class="tournament-card">
                        <div class="card-header"><h3>${t.name}</h3><span class="game-tag">${t.game || 'Game'}</span></div>
                        <div class="card-body">
                            <div class="info-row"><span>Prize Pool</span><span class="prize-pool">₹${t.prizePool || 0}</span></div>
                            <div class="info-row"><span>Entry Fee</span><span>₹${t.entryFee || 0}</span></div>
                            <div class="info-row"><span>Date & Time</span><span>${t.dateTime || 'TBD'}</span></div>
                            <div class="info-row"><span>Status</span><span class="status-badge ${statusClass}">${t.status || 'upcoming'}</span></div>
                        </div>
                    </div>`;
            });
            container.innerHTML = html || '<div class="no-data">No tournaments joined</div>';
        }

        function selectAmount(amt) {
            selectedTopupAmount = amt;
            document.getElementById('customAmount').value = '';
            document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        function clearSelection() { selectedTopupAmount = 0; document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('selected')); }

        function processTopup() {
            const custom = parseInt(document.getElementById('customAmount').value) || 0;
            const amount = selectedTopupAmount || custom;
            const msgEl = document.getElementById('topupMsg');
            if (amount < 10) { msgEl.innerHTML = '<span class="error-msg">Minimum topup is ₹10</span>'; return; }
            const wallet = userData.wallet || { bonus: 0, deposited: 0 };
            const newDeposited = (wallet.deposited || 0) + amount;
            const txId = db.ref().push().key;
            const updates = {};
            updates['users/' + currentUser.uid + '/wallet/deposited'] = newDeposited;
            updates['transactions/' + txId] = { userId: currentUser.uid, userName: userData.name, amount: amount, type: 'topup', description: 'Wallet Topup', timestamp: Date.now() };
            db.ref().update(updates).then(() => {
                msgEl.innerHTML = '<span class="success-msg">₹' + amount + ' added successfully!</span>';
                document.getElementById('customAmount').value = ''; clearSelection(); loadTransactions();
            }).catch(err => { msgEl.innerHTML = '<span class="error-msg">' + err.message + '</span>'; });
        }

        function loadTransactions() {
            db.ref('transactions').orderByChild('userId').equalTo(currentUser.uid).limitToLast(50).on('value', snap => {
                const txs = snap.val() || {};
                const list = document.getElementById('transactionList');
                let html = '';
                Object.keys(txs).sort((a,b) => txs[b].timestamp - txs[a].timestamp).forEach(id => {
                    const tx = txs[id];
                    const color = tx.amount >= 0 ? '#2ecc71' : '#e94560';
                    const sign = tx.amount >= 0 ? '+' : '';
                    const date = new Date(tx.timestamp).toLocaleString();
                    html += `<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #333;">
                        <div><div style="font-weight:600;">${tx.description}</div><div style="font-size:12px;color:#666;">${date}</div></div>
                        <div style="color:${color};font-weight:bold;font-size:16px;">${sign}₹${Math.abs(tx.amount)}</div>
                    </div>`;
                });
                list.innerHTML = html || '<div class="no-data">No transactions yet</div>';
            });
        }

        function showSection(section) {
            document.getElementById('tournamentsSection').classList.add('hidden');
            document.getElementById('walletSection').classList.add('hidden');
            document.getElementById('myTournamentsSection').classList.add('hidden');
            document.getElementById(section + 'Section').classList.remove('hidden');
            if (section === 'myTournaments') loadMyTournaments();
        }
    </script>
</body>
</html>
